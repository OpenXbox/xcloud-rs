[package]
name = "gamestreaming_native"
version = "0.1.0"
authors = ["tuxuser <462620+tuxuser@users.noreply.github.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.13.0"
reqwest = { version = "0.11.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hexdump = "0.1.1"
uuid = { version = "1.2", features = ["v4"] }
pnet = "0.34.0"
webrtc = "0.9.0"
teredo = { path = "../teredo" }
pbkdf2 = { version = "0.11.0", default-features = false }
hex = "0.4.3"
sha2 = "0.10.6"
hmac = "0.12.1"
gamestreaming_auth = { path = "../gamestreaming_auth" }

# common for bins
structopt = { version = "0.3.26", optional = true }

# pcap_parser
pcap = { version = "0.11.0", optional = true }
deku = "0.16"

[features]
pcap = ["dep:pcap", "dep:structopt"]

[[bin]]
name = "pcap-parser"
required-features = ["pcap"]
